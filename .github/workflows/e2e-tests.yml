name: E2E Tests (Playwright)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

# Tests create real trips in the demo backend, so never run two pipelines at once
concurrency:
  group: e2e-tests
  cancel-in-progress: false

jobs:
  e2e:
    name: Rider + driver E2E flow
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ase_assignment/folder

    env:
      CI: true
      RIDER_TEST_USER: ${{ secrets.RIDER_TEST_USER }}
      RIDER_TEST_PASS: ${{ secrets.RIDER_TEST_PASS }}
      DRIVER_TEST_USER: ${{ secrets.DRIVER_TEST_USER }}
      DRIVER_TEST_PASS: ${{ secrets.DRIVER_TEST_PASS }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ase_assignment/folder/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (setup runs first as a dependency)
        run: npx playwright test --project=chromium

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ase_assignment/folder/playwright-report/
          retention-days: 14

      - name: Upload traces and failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ase_assignment/folder/test-results/
          retention-days: 14